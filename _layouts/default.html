<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="Dejan Stanchevski">
    <title>{{ page.title }}</title>
    <script>
        (function () {
            document.documentElement.classList.add("js");
            var theme = localStorage.getItem("theme")
                || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <style>
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation: none;
            mix-blend-mode: normal;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Code+Pro:wght@200;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css?v={{ site.time | date: '%s' }}">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body class="{{ page.body_class }}">
{% include header.html %}
<main>
{{ content }}
</main>
{% include footer.html %}
<script src="/assets/js/main.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
